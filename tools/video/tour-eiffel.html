<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les Secrets de la Tour Eiffel · video</title>
<link rel="stylesheet" href="lib/video.css">
<style>
  #stage { background: #120c07; color: #f6ead2; }
  .parch { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: sepia(.55) brightness(.30) contrast(1.15) saturate(1.1); transform-origin: 50% 45%; }
  .warm { width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgba(224,166,106,.38), rgba(224,166,106,0) 62%); }
  .dust { position: absolute; left: 0; top: 0; border-radius: 50%; background: #f3d79a; box-shadow: 0 0 10px rgba(243,215,154,.8); }
  .serif { font-family: "Cinzel", serif; font-weight: 700; letter-spacing: .02em; }
  .ital { font-family: "Cormorant", serif; font-style: italic; font-weight: 500; }
  .goldt { background: linear-gradient(180deg, #fff3cf, #e8c27a 45%, #a8742e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .goldw .w, .goldl span { background: linear-gradient(180deg, #fff3cf, #e8c27a 45%, #a8742e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .year { font-size: 112px; text-shadow: none; }
  .year span { display: inline-block; white-space: pre; }
  #tower { width: 600px; height: 1100px; overflow: visible; }
  #tower path { fill: none; stroke: #e8c27a; stroke-linecap: round; stroke-linejoin: round; }
  .narr { font-size: 92px; line-height: 1; }
  .punch { font-size: 84px; line-height: 1.05; }
  .q { font-size: 96px; }
  .ccard { width: 440px; height: 660px; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 3px #c9a05a, 0 0 0 9px rgba(201,160,90,.25); }
  .ccard img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .die { width: 190px; height: 190px; border-radius: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 118px; font-weight: 900; color: #fff; font-family: "Inter Display", sans-serif;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 -14px 26px rgba(0,0,0,.28), inset 0 10px 20px rgba(255,255,255,.35); }
  .dl { font-size: 42px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
  .codeT { font-size: 80px; }
  .clue { font-size: 64px; }
  .boxwrap { width: 600px; height: 853px; transform-style: preserve-3d; }
  .boxwrap img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 50px 60px rgba(0,0,0,.7)); }
  .shine { position: absolute; inset: 0; -webkit-mask-image: url(../../docs/assets/img/eif-box-1080.webp); mask-image: url(../../docs/assets/img/eif-box-1080.webp);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; mix-blend-mode: screen; }
  .shine i { position: absolute; top: -20%; bottom: -20%; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,235,190,.6), transparent); transform: skewX(-18deg); }
  .btitle { font-size: 86px; line-height: 1; }
  .bsub { font-size: 60px; opacity: .9; }
  .chip { color: #fff7e6; }
  .url { font-size: 98px; font-weight: 850; letter-spacing: -.035em; color: #fff7e6; }
  .sub { font-size: 46px; font-weight: 550; opacity: .88; }
</style>
</head>
<body>
<div id="stage">
  <img class="parch" id="parch" src="../../docs/assets/img/eif-parchment-1376.webp" alt="">
  <div class="c warm" id="warm"></div>
  <div class="layer" id="dust"></div>

  <svg class="c" id="tower" viewBox="0 0 600 1100"></svg>
  <div class="c serif year center-text goldl" id="year"></div>

  <div class="c ital narr center-text" id="n1"></div>
  <div class="c ital narr center-text" id="n2"></div>
  <div class="c ital narr center-text goldw" id="n3"></div>
  <div class="c serif punch center-text" id="p1"></div>
  <div class="c serif punch center-text goldw" id="p2"></div>

  <div id="cards"></div>
  <div id="qs"></div>

  <div class="c serif codeT center-text goldt" id="codeT"></div>
  <div id="dice"></div>
  <div class="c ital clue center-text" id="clue"></div>

  <div class="c serif btitle center-text goldt" id="bt1"></div>
  <div class="c serif btitle center-text goldt" id="bt2"></div>
  <div class="c ital bsub center-text" id="bsub"></div>
  <div class="c" id="bglow" style="width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle, rgba(232,180,110,.5), rgba(232,180,110,0) 62%)"></div>
  <div class="c boxwrap" id="box"><img src="../../docs/assets/img/eif-box-1080.webp" alt=""><div class="shine"><i id="streak"></i></div></div>
  <div id="chips"></div>

  <img class="c" id="logo" src="../../docs/assets/img/logo-ds4-480.webp" alt="" style="width:430px">
  <div class="c url center-text" id="url">ds4games.com</div>
  <div class="c sub center-text" id="sub"></div>

  <div class="vignette" style="background: radial-gradient(110% 75% at 50% 45%, transparent 45%, rgba(0,0,0,.7) 100%)"></div>
  <div class="grain" style="opacity:.1"></div>
</div>
<script src="lib/engine.js"></script>
<script>
const { p, lerp, put, words, reveal, rng, lang, $ } = V;
const T = {
  es: {
    year: "París, 1889.",
    narr: ["El Autor conoce", "el secreto de", "Gustave Eiffel…"],
    punch: ["…pero no puede", "decir una palabra."],
    qs: ["¿Con quién?", "¿Dónde?", "¿En qué situación?", "¿Y qué comían?"],
    code: "Descifrá el código",
    dl: ["Personaje", "Situación", "Lugar", "Comida"],
    clue: "Pistas sin palabras. Pura deducción.",
    bsub: "Los secretos de la Torre Eiffel",
    chips: ["3–5 jugadores", "2–10 en cooperativo", "25 min"],
    sub: "Envíos desde Francia · Reglamento en español",
  },
  fr: {
    year: "Paris, 1889.",
    narr: ["L’Auteur connaît", "le secret de", "Gustave Eiffel…"],
    punch: ["…mais il ne peut", "pas dire un mot."],
    qs: ["Avec qui ?", "Où ?", "Dans quelle situation ?", "Que mangeaient-ils ?"],
    code: "Déchiffrez le code",
    dl: ["Personnage", "Situation", "Lieu", "Plat"],
    clue: "Des indices sans un mot. Pure déduction.",
    bsub: "",
    chips: ["3–5 joueurs", "2–10 en coopératif", "25 min"],
    sub: "19 € · Expédié depuis Montpellier",
  },
  en: {
    year: "Paris, 1889.",
    narr: ["The Author knows", "Gustave Eiffel’s", "secret…"],
    punch: ["…but can’t say", "a single word."],
    qs: ["Who with?", "Where?", "Doing what?", "Eating what?"],
    code: "Crack the code",
    dl: ["Character", "Situation", "Place", "Dish"],
    clue: "Clues without words. Pure deduction.",
    bsub: "The Secrets of the Eiffel Tower",
    chips: ["3–5 players", "2–10 co-op", "25 min"],
    sub: "€19 · Ships from Montpellier, France",
  },
}[lang];
document.documentElement.lang = lang;
window.DURATION = 22.5;
const S2 = 3.3, S2b = 5.5, S3 = 7.6, S4 = 11.9, S5 = 15.7, S6 = 19.3;

// Ajusta el tamaño de letra para que entre en el ancho
const FITS = [];
function fit(el, max = 960) { FITS.push([el, max]); }
function doFit(el, max) { el.style.fontSize = ""; let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > max && fs > 20) { fs -= 2; el.style.fontSize = fs + "px"; } }

// Año, letra por letra
const yearEl = $("#year");
const Y = Array.from(T.year).map((ch) => { const s = document.createElement("span"); s.textContent = ch; yearEl.appendChild(s); return s; });

const N = ["#n1", "#n2", "#n3"].map((id, i) => { $(id).textContent = T.narr[i]; fit($(id)); return words($(id)); });
const P = ["#p1", "#p2"].map((id, i) => { $(id).textContent = T.punch[i]; fit($(id)); return words($(id)); });

// Polvo dorado flotante
const R = rng(1889);
const DUST = Array.from({ length: 46 }, () => {
  const d = document.createElement("div"); d.className = "dust"; const sz = 2 + R() * 5;
  d.style.width = d.style.height = sz + "px"; $("#dust").appendChild(d);
  return { d, x: R() * 1080, y: R() * 1920, v: 18 + R() * 40, a: R() * 6.28, o: 0.2 + R() * 0.6 };
});

// La torre: se construye de la base a la punta
const svg = $("#tower"); const cx = 300, TOP = 70, HH = 1000;
const yy = (u) => TOP + u * HH;
function hw(u) {
  if (u < 0.07) return 6 + (u / 0.07) * 6;
  if (u < 0.42) return 14 + 38 * Math.pow((u - 0.07) / 0.35, 1.6);
  if (u < 0.68) return 56 + 66 * Math.pow((u - 0.42) / 0.26, 1.4);
  return 126 + 154 * Math.pow((u - 0.68) / 0.32, 1.5);
}
const inner = (u) => 70 + 120 * Math.pow((u - 0.70) / 0.30, 1.3);
const segs = [];
function add(d, u, w = 2.4) { segs.push({ d, u, w }); }
function edge(u0, u1, sign, f = hw, n = 14) {
  let d = ""; for (let i = 0; i <= n; i++) { const u = u0 + (u1 - u0) * (i / n); d += (i ? "L" : "M") + (cx + sign * f(u)).toFixed(1) + " " + yy(u).toFixed(1); }
  add(d, (u0 + u1) / 2, 4);
}
function lattice(u0, u1, n, fl, fr) {
  for (let i = 0; i < n; i++) {
    const a = u0 + (u1 - u0) * (i / n), b = u0 + (u1 - u0) * ((i + 1) / n);
    add(`M${fl(a)} ${yy(a)}L${fr(b)} ${yy(b)}M${fr(a)} ${yy(a)}L${fl(b)} ${yy(b)}`, (a + b) / 2, 1.6);
  }
}
function deck(u, w, h) { add(`M${cx - w} ${yy(u)}L${cx + w} ${yy(u)}L${cx + w} ${yy(u) + h}L${cx - w} ${yy(u) + h}Z`, u, 3.4); }
// patas
edge(0.70, 1, -1); edge(0.70, 1, 1); edge(0.70, 1, -1, inner); edge(0.70, 1, 1, inner);
lattice(0.70, 1, 6, (u) => cx - hw(u), (u) => cx - inner(u));
lattice(0.70, 1, 6, (u) => cx + inner(u), (u) => cx + hw(u));
add(`M${cx - 182} ${yy(0.975)}Q${cx} ${yy(0.70)} ${cx + 182} ${yy(0.975)}`, 0.86, 3);
deck(0.675, 150, 26);
// tramo medio
edge(0.44, 0.675, -1); edge(0.44, 0.675, 1);
lattice(0.44, 0.675, 4, (u) => cx - hw(u), (u) => cx + hw(u));
deck(0.415, 72, 20);
// tramo alto
edge(0.08, 0.415, -1); edge(0.08, 0.415, 1);
lattice(0.08, 0.415, 7, (u) => cx - hw(u), (u) => cx + hw(u));
deck(0.055, 16, 22);
add(`M${cx} ${yy(0.055)}L${cx} ${yy(0.055) - 62}`, 0.0, 3);
segs.forEach((s) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
  el.setAttribute("d", s.d); el.setAttribute("stroke-width", s.w); svg.appendChild(el);
  s.el = el; s.len = el.getTotalLength(); el.style.strokeDasharray = s.len; el.style.strokeDashoffset = s.len;
});
svg.style.filter = "drop-shadow(0 0 6px rgba(232,194,122,.75)) drop-shadow(0 0 24px rgba(232,194,122,.35))";

// Personajes y preguntas
const CHAR = [["dancer", -275, -10], ["nun", 0, 0], ["police", 275, 10]].map(([n, x, r], i) => {
  const c = document.createElement("div"); c.className = "c ccard"; c.innerHTML = `<img src="../../docs/assets/img/eif-${n}-960.webp" alt="">`;
  $("#cards").appendChild(c); return { c, x, r, i };
});
CHAR[1].c.style.zIndex = 2;
const Q = T.qs.map((q) => { const d = document.createElement("div"); d.className = "c serif q center-text goldt"; d.textContent = q; $("#qs").appendChild(d); fit(d); return d; });

// Dados del código
$("#codeT").textContent = T.code; fit($("#codeT"));
$("#clue").textContent = T.clue; fit($("#clue"), 980);
const DIE = [["#2f5fd0", 5], ["#c9302c", 1], ["#e3b524", 5], ["#2f9a4a", 3]].map(([col, v], i) => {
  const d = document.createElement("div"); d.className = "c die"; d.style.background = `linear-gradient(160deg, ${col}, ${col} 55%, rgba(0,0,0,.25))`; d.style.backgroundColor = col;
  const l = document.createElement("div"); l.className = "c dl"; l.textContent = T.dl[i]; l.style.color = col === "#e3b524" ? "#f3cf5a" : col === "#2f5fd0" ? "#8fb0ff" : col === "#c9302c" ? "#ff8a80" : "#7fd796";
  $("#dice").append(d, l); return { d, l, v, x: -345 + i * 230 };
});

// Caja
const isFr = lang === "fr";
$("#bt1").textContent = "Les Secrets"; $("#bt2").textContent = "de la Tour Eiffel"; fit($("#bt2"));
$("#bsub").textContent = T.bsub; fit($("#bsub"));
$("#sub").textContent = T.sub; fit($("#sub"), 980);
const chips = T.chips.map((txt) => { const d = document.createElement("div"); d.className = "c chip glass"; d.textContent = txt; $("#chips").appendChild(d); return d; });
function chipRow(els, gap = 20) {
  const ws = els.map((e) => e.offsetWidth); const total = ws.reduce((a, b) => a + b, 0) + gap * (els.length - 1);
  let x = -total / 2; return ws.map((w) => { const cx = x + w / 2; x += w + gap; return cx; });
}
let CX = [];
// Las medidas se toman cuando las fuentes ya cargaron
window.setup = async () => {
  await document.fonts.ready;
  FITS.forEach(([el, max]) => doFit(el, max));
  // Si no entran en una fila, el último chip baja a una segunda fila
  if (chips.reduce((a, c) => a + c.offsetWidth, 0) + 40 > 1000) {
    const top = chipRow(chips.slice(0, -1)); CX = [...top.map((x) => [x, 0]), [0, 104]];
  } else CX = chipRow(chips).map((x) => [x, 0]);
};

window.render = function (t) {
  $("#parch").style.transform = `scale(${1.08 + 0.1 * (t / DURATION)})`;
  put($("#warm"), { x: 60 * Math.sin(t * 0.4), y: -120 + 50 * Math.cos(t * 0.3), s: 1 + 0.05 * Math.sin(t * 1.3) });
  DUST.forEach((o) => {
    const y = ((o.y - t * o.v) % 1920 + 1920) % 1920, x = o.x + 30 * Math.sin(t * 0.6 + o.a);
    o.d.style.transform = `translate(${x}px,${y}px)`; o.d.style.opacity = o.o * (0.6 + 0.4 * Math.sin(t * 2 + o.a));
  });

  // 1. Año y torre
  const s1out = p(t, S2 - 0.4, S2 + 0.2, "inOut");
  Y.forEach((s, i) => { const k = p(t, 0.25 + i * 0.07, 0.75 + i * 0.07, "expo"); s.style.opacity = k; s.style.transform = `translateY(${(1 - k) * 30}px)`; s.style.filter = k < 0.99 ? `blur(${(1 - k) * 10}px)` : "none"; });
  put($("#year"), { y: -660 - s1out * 40, op: 1 - s1out, blur: s1out * 10 });
  segs.forEach((s) => {
    const st = 0.2 + (1 - s.u) * 2.1;
    s.el.style.strokeDashoffset = s.len * (1 - p(t, st, st + 0.55, "inOut"));
  });
  const tw = p(t, S2 - 0.4, S2 + 0.6, "inOut"), twOut = p(t, S3 - 0.5, S3, "in");
  put($("#tower"), { y: 70 - tw * 30, s: 1 - tw * 0.08, op: (1 - tw * 0.8) * (1 - twOut) + 0.0001, blur: 0 });

  // 2. Narración
  const n1out = p(t, S2b - 0.2, S2b + 0.3, "inOut");
  const nOut = p(t, S3 - 0.45, S3, "in");
  N.forEach((sp, i) => { reveal(sp, t, S2 + 0.1 + i * 0.4, { gap: 0.1, dur: 0.6, dy: 40, blur: 12 }); put($(["#n1", "#n2", "#n3"][i]), { y: -300 + i * 110 - n1out * 120, op: (1 - n1out * 0.6) * (1 - nOut), s: 1 - n1out * 0.18 }); });
  P.forEach((sp, i) => { reveal(sp, t, S2b + 0.15 + i * 0.35, { gap: 0.1, dur: 0.5, dy: 50, blur: 14 }); put($(["#p1", "#p2"][i]), { y: 130 + i * 105, op: 1 - nOut, blur: nOut * 14 }); });

  // 3. Personajes
  const s3out = p(t, S4 - 0.45, S4, "in");
  CHAR.forEach((o) => {
    const k = p(t, S3 + 0.1 + o.i * 0.18, S3 + 0.9 + o.i * 0.18, "back");
    const fl = Math.sin((t - S3) * 1.4 + o.i) * 8;
    put(o.c, { x: o.x * k, y: 260 + (1 - k) * 900 + fl + s3out * 400, r: o.r * k, op: t > S3 ? 1 - s3out : 0, s: o.i === 1 ? 1.04 : 0.9 });
  });
  Q.forEach((d, i) => {
    const a = S3 + 0.35 + i * 0.95, b = a + 0.95, last = i === Q.length - 1;
    const kin = p(t, a, a + 0.35, "expo"), kout = last ? s3out : p(t, b - 0.15, b + 0.1, "in");
    put(d, { y: -560 + (1 - kin) * 50 - kout * 50, op: t >= a ? kin * (1 - kout) : 0, blur: (1 - kin) * 12 + kout * 12, s: 0.94 + kin * 0.06 });
  });

  // 4. Código secreto
  const s4out = p(t, S5 - 0.45, S5, "in"), on4 = t > S4 - 0.05 && t < S5;
  const ct = p(t, S4, S4 + 0.6, "expo");
  put($("#codeT"), { y: -470 + (1 - ct) * 40, op: on4 ? ct * (1 - s4out) : 0, blur: (1 - ct) * 12 });
  DIE.forEach((o, i) => {
    const k = p(t, S4 + 0.2 + i * 0.12, S4 + 0.8 + i * 0.12, "back");
    const settle = S4 + 1.1 + i * 0.28, rolling = t < settle;
    o.d.textContent = rolling ? String(((Math.floor(t * 14 + i * 3) * 7) % 6) + 1) : String(o.v);
    const spin = rolling ? (1 - p(t, S4, settle, "out")) * 540 : 0;
    const pop = p(t, settle, settle + 0.25, "back");
    put(o.d, { x: o.x, y: -60 + (1 - k) * -500 + s4out * 300, r: spin, s: rolling ? 0.92 : 0.92 + (1 - Math.abs(1 - pop * 1)) * 0.0 + 0.08 * Math.min(1, pop), op: on4 ? Math.min(1, k * 2) * (1 - s4out) : 0 });
    const lk = p(t, settle + 0.1, settle + 0.5, "expo");
    put(o.l, { x: o.x, y: 105 + (1 - lk) * 20 + s4out * 300, op: on4 ? lk * (1 - s4out) : 0 });
  });
  const cl = p(t, S4 + 2.6, S4 + 3.2, "expo");
  put($("#clue"), { y: 330 + (1 - cl) * 30, op: on4 ? cl * (1 - s4out) : 0, blur: (1 - cl) * 10 });

  // 5. Caja
  const s5in = p(t, S5, S5 + 1.1, "expo"), s5out = p(t, S6 - 0.4, S6, "in"), on5 = t > S5 - 0.05 && t < S6;
  const b1 = p(t, S5 + 0.1, S5 + 0.7, "expo"), b2 = p(t, S5 + 0.3, S5 + 0.9, "expo"), b3 = p(t, S5 + 0.6, S5 + 1.2, "expo");
  put($("#bt1"), { y: -700 + (1 - b1) * 40, op: on5 ? b1 * (1 - s5out) : 0, blur: (1 - b1) * 12 });
  put($("#bt2"), { y: -600 + (1 - b2) * 40, op: on5 ? b2 * (1 - s5out) : 0, blur: (1 - b2) * 12 });
  put($("#bsub"), { y: -500 + (1 - b3) * 30, op: on5 && T.bsub ? b3 * 0.9 * (1 - s5out) : 0 });
  put($("#box"), {
    y: 70 + (T.bsub ? 20 : 0) + (1 - s5in) * 340 + 12 * Math.sin((t - S5) * 1.5), ry: lerp(-34, 8, s5in) + 3 * Math.sin((t - S5) * 1.1),
    s: (0.84 + s5in * 0.16) * (1 + s5out * 0.08), op: on5 ? Math.min(1, s5in * 1.6) * (1 - s5out) : 0, blur: s5out * 18,
  });
  put($("#bglow"), { y: 80, s: 0.75 + s5in * 0.35 + 0.04 * Math.sin(t * 2), op: on5 ? s5in * (1 - s5out) : 0 });
  $("#streak").style.left = `${lerp(-50, 130, p(t, S5 + 1.2, S5 + 2.3, "inOut"))}%`;
  chips.forEach((c, i) => {
    const k = p(t, S5 + 1.1 + i * 0.16, S5 + 1.6 + i * 0.16, "back");
    const [cxx, cyy] = CX[i] || [0, 0];
    put(c, { x: cxx, y: 580 + cyy + (1 - k) * 60, s: 0.7 + k * 0.3, op: on5 ? Math.min(1, k * 1.5) * (1 - s5out) : 0 });
  });

  // 6. Cierre
  const lg = p(t, S6, S6 + 0.9, "back");
  put($("#logo"), { y: -230, s: 0.6 + lg * 0.4, op: t >= S6 ? Math.min(1, lg * 1.4) : 0, r: (1 - lg) * -8 });
  const u = p(t, S6 + 0.45, S6 + 1.1, "expo");
  put($("#url"), { y: 60 + (1 - u) * 50, op: u, blur: (1 - u) * 14 });
  const sb = p(t, S6 + 0.8, S6 + 1.4, "expo");
  put($("#sub"), { y: 165 + (1 - sb) * 40, op: sb * 0.9 });
};
window.render(0);
</script>
</body>
</html>
